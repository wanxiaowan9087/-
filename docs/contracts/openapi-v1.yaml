        user_message_id:
          $ref: "#/components/schemas/Uuid"
        candidate_content:
          type: string
          maxLength: 100000
          description: 仅 reviewer 可见的未发布候选
        reason_codes:
          type: array
          minItems: 1
          items:
            type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        status:
          $ref: "#/components/schemas/ReviewStatus"
        version:
          type: integer
          minimum: 1
        created_at:
          $ref: "#/components/schemas/Timestamp"
        decided_at:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
    ReviewPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReviewTask"
        page:
          $ref: "#/components/schemas/PageInfo"
    ReviewPageEnvelope:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/ReviewPage"
    ReviewDecisionRequest:
      oneOf:
        - $ref: "#/components/schemas/ApproveReviewRequest"
        - $ref: "#/components/schemas/RejectReviewRequest"
        - $ref: "#/components/schemas/EditReviewRequest"
      discriminator:
        propertyName: decision
        mapping:
          approve: "#/components/schemas/ApproveReviewRequest"
          reject: "#/components/schemas/RejectReviewRequest"
          edit_and_publish: "#/components/schemas/EditReviewRequest"
    ApproveReviewRequest:
      type: object
      additionalProperties: false
      required: [decision, expected_version]
      properties:
        decision:
          type: string
          const: approve
        expected_version:
          type: integer
          minimum: 1
        note:
          type: [string, "null"]
          maxLength: 1000
          default: null
    RejectReviewRequest:
      type: object
      additionalProperties: false
      required: [decision, expected_version, note]
      properties:
        decision:
          type: string
          const: reject
        expected_version:
          type: integer
          minimum: 1
        note:
          type: string
          minLength: 1
          maxLength: 1000
    EditReviewRequest:
      type: object
      additionalProperties: false
      required: [decision, expected_version, edited_content]
      properties:
        decision:
          type: string
          const: edit_and_publish
        expected_version:
          type: integer
          minimum: 1
        edited_content:
          type: string
          minLength: 1
          maxLength: 100000
        note:
          type: [string, "null"]
          maxLength: 1000
          default: null
    ReviewDecisionResult:
      type: object
      additionalProperties: false
      required: [review_id, status, published_message_id, decided_at, version]
      properties:
        review_id:
          $ref: "#/components/schemas/Uuid"
        status:
          type: string
          enum: [approved, rejected, edited_and_published]
        published_message_id:
          anyOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
        decided_at:
          $ref: "#/components/schemas/Timestamp"
        version:
          type: integer
          minimum: 2
    ReviewDecisionEnvelope:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/ReviewDecisionResult"
    UsageSummaryTopic:
      type: object
      additionalProperties: false
      required: [name, count]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        count:
          type: integer
          minimum: 1
    UsageSummaryMemory:
      type: object
      additionalProperties: false
      required: [content, confidence, source_message_id]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 5000
        confidence:
          type: number
          minimum: 0
          maximum: 1
        source_message_id:
          $ref: "#/components/schemas/Uuid"
    UsageSummaryProduct:
      type: object
      additionalProperties: false
      required: [model_code, recommendation_count]
      properties:
        product_id:
          type: [string, "null"]
          maxLength: 128
        model_code:
          type: string
          minLength: 1
          maxLength: 128
        recommendation_count:
          type: integer
          minimum: 1
    UsageSummaryDeviceUsage:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status:
          type: string
          enum: [available, unavailable]
        reason:
          type: [string, "null"]
          maxLength: 200
    UsageSummaryConversationOverview:
      type: object
      additionalProperties: false
      required: [session_count, message_count, active_days, top_topics]
      properties:
        session_count:
          type: integer
          minimum: 0
        message_count:
          type: integer
          minimum: 0
        active_days:
          type: integer
          minimum: 0
        top_topics:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/UsageSummaryTopic"
    UsageSummaryProductActivity:
      type: object
      additionalProperties: false
      required: [recommended_models, detail_view_count, three_d_view_count]
      properties:
        recommended_models:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/UsageSummaryProduct"
        detail_view_count:
          type: integer
          minimum: 0
        three_d_view_count:
          type: integer
          minimum: 0
    UsageSummary:
      type: object
      additionalProperties: false
      required:
        - status
        - version
        - conversation_overview
        - facts
        - preferences
        - product_activity
        - device_usage
        - generated_at
        - data_through_at
      properties:
        status:
          type: string
          enum: [ready, updating, empty]
        version:
          type: integer
          minimum: 0
        conversation_overview:
          $ref: "#/components/schemas/UsageSummaryConversationOverview"
        facts:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/UsageSummaryMemory"
        preferences:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/UsageSummaryMemory"
        product_activity:
          $ref: "#/components/schemas/UsageSummaryProductActivity"
        device_usage:
          $ref: "#/components/schemas/UsageSummaryDeviceUsage"
        generated_at:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        data_through_at:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
    UsageSummaryEnvelope:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/UsageSummary"
    UsageEventRequest:
      type: object
      additionalProperties: false
      required: [event_type, product_id]
      properties:
        event_type:
          type: string
          enum: [product_detail_viewed, product_3d_viewed]
        product_id:
          type: string
          minLength: 1
          maxLength: 128
        model_code:
          type: [string, "null"]
          maxLength: 128
          default: null
    UsageEvent:
      type: object
      additionalProperties: false
      required: [id, event_type, product_id, model_code, occurred_at]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        event_type:
          type: string
          enum: [product_detail_viewed, product_3d_viewed, product_recommended]
        product_id:
          type: [string, "null"]
          maxLength: 128
        model_code:
          type: [string, "null"]
          maxLength: 128
        occurred_at:
          $ref: "#/components/schemas/Timestamp"
    UsageEventEnvelope:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/UsageEvent"
