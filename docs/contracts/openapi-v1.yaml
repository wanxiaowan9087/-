openapi: 3.1.0
info:
  title: Agent Vue FastAPI Contract
  version: 1.0.0
  description: |
    本文件已随设计基线 65c08f32f5f61b74791b260a02fd62ce3fe91bd1 获得用户批准，
    是 `/api/v1` 唯一机器可读契约；实现、前端类型、契约测试和文档必须与批准版本一致。
    项目采用单租户简化身份，业务角色为 `user`、`reviewer` 与 `admin`；对象级授权仍由服务端执行。
servers:
  - url: /api/v1
tags:
  - name: Health
  - name: Authentication
  - name: Sessions
  - name: Chat
  - name: Runs
  - name: Memories
  - name: Usage Summaries
  - name: Reviews
  - name: Knowledge
  - name: Administration
security:
  - bearerAuth: []
paths:
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: 进程存活探针
      security: []
      x-required-role: anonymous
      responses:
        "200":
          description: 进程可响应
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveEnvelope"
        "500":
          $ref: "#/components/responses/InternalError"
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: 服务就绪探针
      description: PostgreSQL 是必需依赖；Redis、向量库和模型只返回脱敏后的可用性，不暴露连接信息。
      security: []
      x-required-role: anonymous
      responses:
        "200":
          description: 必需依赖已就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyEnvelope"
        "503":
          description: 必需依赖未就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /auth/register:
    post:
      tags: [Authentication]
      operationId: registerUser
      summary: 注册用户并签发访问令牌
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionEnvelope"
        "409":
          $ref: "#/components/responses/Conflict"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/login:
    post:
      tags: [Authentication]
      operationId: loginUser
      summary: 登录并签发访问令牌
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/sms-codes:
    post:
      tags: [Authentication]
      operationId: sendSmsCode
      summary: 发送注册或找回密码验证码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SmsCodeRequest" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SmsCodeEnvelope" }
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
  /auth/password-resets:
    post:
      tags: [Authentication]
      operationId: resetPassword
      summary: 使用短信验证码重置密码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasswordResetEnvelope" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
  /legal/user-agreement:
    get:
      tags: [Authentication]
      operationId: getUserAgreement
      summary: 获取用户协议
      security: []
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalDocumentEnvelope" }
  /legal/privacy-policy:
    get:
      tags: [Authentication]
      operationId: getPrivacyPolicy
      summary: 获取隐私政策
      security: []
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalDocumentEnvelope" }
  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: 获取当前登录用户资料
      x-required-role: user
      responses:
        "200":
          description: 当前用户资料
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Authentication]
      operationId: updateCurrentUser
      summary: 更新当前登录用户的昵称或头像
      x-required-role: user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: 用户资料已更新
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/me/password:
    patch:
      tags: [Authentication]
      operationId: changeCurrentUserPassword
      summary: 修改当前用户密码
      x-required-role: user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: 密码已更新
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /auth/me/avatar:
    put:
      tags: [Authentication]
      operationId: uploadCurrentUserAvatar
      summary: 上传当前用户头像
      x-required-role: user
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: 头像已更新
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /knowledge/files:
    post:
      tags: [Knowledge]
      operationId: uploadKnowledgeFile
      summary: 上传知识库文件
      x-required-role: admin
      parameters:
        - name: filename
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 180
        - name: overwrite
          in: query
          required: false
          description: 明确替换同名旧版本；完全相同内容仍按重复上传拒绝
          schema:
            type: boolean
            default: false
        - name: allow_similar
          in: query
          required: false
          description: 明确允许与已有文档高度相似的内容作为独立文档保留
          schema:
            type: boolean
            default: false
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string, format: binary }
          text/markdown:
            schema: { type: string, format: binary }
          application/pdf:
            schema: { type: string, format: binary }
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: 知识文件已上传
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: 文档已存在或同名内容冲突
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
    get:
      tags: [Knowledge]
      operationId: listKnowledgeFiles
      summary: 列出已入库的知识文件
      x-required-role: admin
      responses:
        "200":
          description: 知识文件列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeFilePageEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /knowledge/files/{document_id}:
    get:
      tags: [Knowledge]
      operationId: getKnowledgeFile
      x-required-role: admin
      responses:
        "200":
          description: 知识文件详情
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Knowledge]
      operationId: updateKnowledgeFile
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateKnowledgeFileRequest"
      responses:
        "200":
          description: 知识文件已更新
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
    delete:
      tags: [Knowledge]
      operationId: deleteKnowledgeFile
      x-required-role: admin
      responses:
        "200":
          description: 知识文件已删除
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
  /knowledge/reindex:
    post:
      tags: [Knowledge]
      operationId: reindexKnowledgeFiles
      summary: 重建已上传知识文件的检索索引
      x-required-role: admin
      responses:
        "200":
          description: 已完成索引重建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeReindexEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
  /admin/external-identity-mappings:
    put:
      tags: [Administration]
      operationId: upsertExternalIdentityMapping
      summary: 授权平台账号访问指定外部业务用户的报告数据
      description: 仅管理员可维护映射。报告工作流必须先解析此映射，未授权时不得读取外部业务数据。
      x-required-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalIdentityMappingRequest"
      responses:
        "200":
          description: 授权映射已创建或更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalIdentityMappingEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /me/usage-summary:
    get:
      tags: [Usage Summaries]
      operationId: getCurrentUserUsageSummary
      summary: 获取当前用户的平台使用总结
      description: |
        返回由真实站内对话、长期记忆和已推荐型号汇总的最新快照。
        服务端从访问令牌确定用户身份，不接受 user_id 参数；设备业务数据缺失时返回明确状态，不会编造。
      x-required-role: user
      responses:
        "200":
          description: 当前用户总结快照；数据不足时返回 status=empty。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageSummaryEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
  /me/usage-events:
    post:
      tags: [Usage Summaries]
      operationId: recordCurrentUserUsageEvent
      summary: 记录当前用户的产品浏览行为
      description: 仅允许记录详情页和 3D 查看行为；用户身份从访问令牌确定，写入数据严格按 user_id 隔离。
      x-required-role: user
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsageEventRequest"
      responses:
        "201":
          description: 行为已记录
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageEventEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
  /sessions:
    get:
      tags: [Sessions]
      operationId: listSessions
      summary: 分页列出当前用户的会话
      x-required-role: user
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 会话页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPageEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
    post:
      tags: [Sessions]
      operationId: createSession
      summary: 创建会话
      x-required-role: user
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: 会话已创建；幂等重放返回相同状态码和响应体
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
  /sessions/{session_id}:
    get:
      tags: [Sessions]
      operationId: getSession
      summary: 获取当前用户的会话详情
      x-required-role: user
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: 会话详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
    delete:
      tags: [Sessions]
      operationId: deleteSession
      summary: 删除当前用户的会话及其关联记录
      x-required-role: user
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: 会话及关联记录已删除
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteSessionEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
  /sessions/{session_id}/messages:
    get:
      tags: [Sessions]
      operationId: listSessionMessages
      summary: 按创建时间升序分页读取会话消息
      description: cursor 是服务端生成的不可解释游标；翻页期间新消息只会出现在后续页，不重复已返回消息。
      x-required-role: user
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 消息页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePageEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
  /chat/stream:
    post:
      tags: [Chat]
      operationId: streamChat
      summary: 发起新消息或基于原用户消息重试，并返回 SSE
      description: |
        `mode=new` 创建一条用户消息和一次 Run；`mode=retry` 以已有 `original_user_message_id`
        创建新 Run，但不复制原用户消息。两种模式共享同一深接口，避免重复的新建/重试路由。

        连接断开不会取消 Run。客户端须使用相同 Idempotency-Key、完全相同请求体以及
        `Last-Event-ID` 重新 POST，服务端先重放后续已持久化事件，再继续实时跟随。
        主动停止必须调用 `POST /runs/{run_id}/cancel`。
      x-required-role: user
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/LastEventId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: |
            SSE 帧格式为 `id: <sequence>`、`event: <event_type>`、`data: <JSON>`。
            每个 data 必须匹配 SseEvent 判别联合；响应开始后所有失败只通过终止 `error` 事件表达。
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestId"
            X-Session-ID:
              $ref: "#/components/headers/SessionId"
            X-Run-ID:
              $ref: "#/components/headers/RunId"
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SseEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          description: SSE 重放窗口已过期；客户端应读取消息和 Run trace 恢复最终状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/DependencyUnavailable"
  /chat/{message_id}/feedback:
    post:
      tags: [Chat]
      operationId: createMessageFeedback
      summary: 对自己的已发布助手消息提交一次反馈
      x-required-role: user
      parameters:
        - $ref: "#/components/parameters/MessageId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFeedbackRequest"
      responses:
        "201":
          description: 反馈已创建；同一用户与消息只允许一条反馈
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
  /runs/{run_id}/cancel:
    post:
      tags: [Runs]
      operationId: cancelRun
      summary: 请求服务端取消 Run
      description: 关闭浏览器连接不等于取消；此接口设置持久取消标记并尽力中断模型与工具。
      x-required-role: user
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelRunRequest"
      responses:
        "202":
          description: 取消请求已接受
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelRunEnvelope"
        "200":
          description: Run 已处于终止状态，无需再次取消
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelRunEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
  /runs/{run_id}/trace:
    get:
      tags: [Runs]
      operationId: getRunTrace
      summary: 获取脱敏后的 Run 追踪
      description: user 只能访问自己的 Run；reviewer 只能额外访问其审核任务关联的 Run。
      x-required-role: user-or-linked-reviewer
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run 追踪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunTraceEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
  /memories:
    get:
      tags: [Memories]
      operationId: listMemories
      summary: 分页列出当前用户的长期记忆
      x-required-role: user
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/MemoryStatus"
        - name: memory_type
          in: query
          schema:
            $ref: "#/components/schemas/MemoryType"
      responses:
        "200":
          description: 记忆页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryPageEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
  /memories/{memory_id}:
    patch:
      tags: [Memories]
      operationId: updateMemory
      summary: 纠正或停用当前用户的一条长期记忆
      x-required-role: user
      parameters:
        - $ref: "#/components/parameters/MemoryId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemoryRequest"
      responses:
        "200":
          description: 记忆已更新
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
    delete:
      tags: [Memories]
      operationId: deleteMemory
      summary: 逻辑删除当前用户的一条长期记忆
      description: 在线数据立即不可用并记录审计；备份副本按备份保留周期自然过期。
      x-required-role: user
      parameters:
        - $ref: "#/components/parameters/MemoryId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: If-Match
          in: header
          required: true
          description: 当前整数版本，例如 `"3"`，用于防止误删已被修改的记忆。
          schema:
            type: string
            pattern: '^[1-9][0-9]*$'
      responses:
        "200":
          description: 删除结果
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteMemoryEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
  /reviews:
    get:
      tags: [Reviews]
      operationId: listReviews
      summary: 分页列出人工审核队列
      x-required-role: reviewer
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ReviewStatus"
      responses:
        "200":
          description: 审核任务页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewPageEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
  /reviews/{review_id}/decision:
    post:
      tags: [Reviews]
      operationId: decideReview
      summary: 批准、驳回或编辑后发布审核候选
      description: 决定只能成功一次；expected_version 提供乐观并发控制，全部尝试写入审计。
      x-required-role: reviewer
      parameters:
        - $ref: "#/components/parameters/ReviewId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecisionRequest"
      responses:
        "200":
          description: 审核决定已应用
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewDecisionEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        可替换认证 Adapter 验证令牌并提供 `sub` 与 `role`；role 只能是 `user`、`reviewer` 或 `admin`。
        reviewer 具备普通 user 能力，但不得绕过对象级授权读取无关用户资源。
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: 服务端签名或不透明游标；不得由客户端拼接。
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        16–128 个可打印 ASCII 字符，由客户端为一次业务意图生成。作用域为已认证 subject、
        operationId 和规范化请求；保存至少 24 小时。相同 key 与相同请求重放原始状态码和结果；
        相同 key 不同请求返回 409 IDEMPOTENCY_KEY_REUSED；原请求仍执行时返回
        409 IDEMPOTENCY_IN_PROGRESS。不得把 key 写入日志原文。
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[\x21-\x7E]+$'
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: 最后完整处理的 SSE sequence；恢复时只重放 sequence 更大的事件。
      schema:
        type: integer
        minimum: 0
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    MessageId:
      name: message_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    MemoryId:
      name: memory_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    ReviewId:
      name: review_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
  headers:
    RequestId:
      description: 本次 HTTP 请求标识
      schema:
        $ref: "#/components/schemas/RequestId"
    SessionId:
      description: 会话 UUID
      schema:
        $ref: "#/components/schemas/Uuid"
    RunId:
      description: Run UUID
      schema:
        $ref: "#/components/schemas/Uuid"
    IdempotencyReplayed:
      description: "`true` 表示响应来自幂等记录重放，否则为 `false`"
      schema:
        type: boolean
  responses:
    BadRequest:
      description: 请求语义、游标或状态不合法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: 缺少或无效身份
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: 角色或对象级权限不足
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: 资源不存在；可用于隐藏其他用户资源
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: 幂等键、版本、唯一性、并发 Run 或资源状态冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationError:
      description: 请求结构校验失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: 请求超过限流
      headers:
        Retry-After:
          description: 建议重试等待秒数
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalError:
      description: 未分类内部错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    StorageUnavailable:
      description: 永久存储不可用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    DependencyUnavailable:
      description: 模型、工具、检索或存储依赖在流建立前不可用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Uuid:
      type: string
      format: uuid
    RequestId:
      type: string
      minLength: 8
      maxLength: 128
      pattern: '^[A-Za-z0-9_-]+$'
    Timestamp:
      type: string
      format: date-time
      description: 带时区的 ISO 8601 UTC 时间
    ApiEnvelopeBase:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          const: OK
        message:
          type: string
          const: success
        request_id:
          $ref: "#/components/schemas/RequestId"
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - BAD_REQUEST
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - IDEMPOTENCY_KEY_REUSED
        - IDEMPOTENCY_IN_PROGRESS
        - STREAM_REPLAY_EXPIRED
        - RATE_LIMITED
        - MODEL_TIMEOUT
        - MODEL_UNAVAILABLE
        - TOOL_TIMEOUT
        - TOOL_FAILED
        - RETRIEVAL_FAILED
        - STORAGE_UNAVAILABLE
        - REVIEW_REQUIRED
        - CANCELLED
        - INTERNAL_ERROR
    ValidationIssue:
      type: object
      additionalProperties: false
      required: [field, reason]
      properties:
        field:
          type: string
          maxLength: 256
        reason:
          type: string
          maxLength: 512
    ErrorData:
      type: object
      additionalProperties: false
      properties:
        retryable:
          type: boolean
          default: false
        retry_after_seconds:
          type: integer
          minimum: 1
        issues:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/ValidationIssue"
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, data, request_id]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          minLength: 1
          maxLength: 512
        data:
          anyOf:
            - $ref: "#/components/schemas/ErrorData"
            - type: "null"
        request_id:
          $ref: "#/components/schemas/RequestId"
    PageInfo:
      type: object
      additionalProperties: false
      required: [next_cursor, has_more]
      properties:
        next_cursor:
          type: [string, "null"]
          maxLength: 512
        has_more:
          type: boolean
    DependencyState:
      type: string
      enum: [available, degraded, unavailable, not_checked]
    LiveStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: alive
    ReadyStatus:
      type: object
      additionalProperties: false
      required: [status, dependencies]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        dependencies:
          type: object
          additionalProperties: false
          required: [postgresql, redis, vector_store, model]
          properties:
            postgresql:
              $ref: "#/components/schemas/DependencyState"
            redis:
              $ref: "#/components/schemas/DependencyState"
            vector_store:
              $ref: "#/components/schemas/DependencyState"
            model:
              $ref: "#/components/schemas/DependencyState"
    LiveEnvelope:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/LiveStatus"
    ReadyEnvelope:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/ReadyStatus"
    CreateSessionRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: [string, "null"]
          minLength: 1
          maxLength: 120
          default: null
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nickname:
          type: string
          minLength: 1
          maxLength: 40
        avatar_url:
          type: string
          minLength: 8
          maxLength: 2048
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          minLength: 6
          maxLength: 20
        new_password:
          type: string
          minLength: 6
          maxLength: 20
          pattern: '^(?=.*[A-Za-z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{6,20}$'
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [phone, password, nickname, verification_code, user_agreement_version, privacy_policy_version, agree_user_agreement, agree_privacy_policy]
      properties:
        phone:
          type: string
          minLength: 11
          maxLength: 16
        password:
          type: string
          minLength: 6
          maxLength: 20
          pattern: '^(?=.*[A-Za-z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{6,20}$'
        nickname:
          type: string
          minLength: 1
          maxLength: 40
        verification_code:
          type: string
          pattern: '^[0-9]{6}$'
        user_agreement_version:
          type: string
          minLength: 1
          maxLength: 32
        privacy_policy_version:
          type: string
          minLength: 1
          maxLength: 32
        agree_user_agreement:
          type: boolean
          const: true
        agree_privacy_policy:
          type: boolean
          const: true
        avatar_url:
          type: [string, "null"]
          minLength: 8
          maxLength: 2048
          default: null
    LoginRequest:
      type: object
      additionalProperties: false
      required: [phone, password]
      properties:
        phone:
          type: string
          minLength: 11
          maxLength: 16
        password:
          type: string
          minLength: 6
          maxLength: 20
    SmsCodeRequest:
      type: object
      additionalProperties: false
      required: [phone, purpose]
      properties:
        phone: { type: string, minLength: 11, maxLength: 16 }
        purpose: { type: string, enum: [register, password_reset] }
    SmsCodeResult:
      type: object
      required: [accepted, retry_after_seconds]
      properties:
        accepted: { type: boolean }
        retry_after_seconds: { type: integer, minimum: 0 }
    SmsCodeEnvelope:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelopeBase"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/SmsCodeResult" }
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [phone, verification_code, new_password]
      properties:
        phone: { type: string, minLength: 11, maxLength: 16 }
        verification_code: { type: string, pattern: '^[0-9]{6}$' }
        new_password:
          type: string
          minLength: 6
          maxLength: 20
          pattern: '^(?=.*[A-Za-z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{6,20}$'
    PasswordResetResult:
      type: object
      required: [reset]
      properties: { reset: { type: boolean, const: true } }
    PasswordResetEnvelope:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelopeBase"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/PasswordResetResult" }
    LegalDocument:
      type: object
      required: [document_type, version, title, content, content_sha256, effective_at]
      properties:
        document_type: { type: string, enum: [user_agreement, privacy_policy] }
        version: { type: string }
        title: { type: string }
        content: { type: string }
        content_sha256: { type: string, minLength: 64, maxLength: 64 }
        effective_at: { $ref: "#/components/schemas/Timestamp" }
    LegalDocumentEnvelope:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelopeBase"
        - type: object
          required: [data]
          properties:
            data: { $ref: "#/components/schemas/LegalDocument" }
    AuthUser:
      type: object
      additionalProperties: false
      required: [id, username, nickname, avatar_url, role, created_at]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        username:
          type: string
          minLength: 3
          maxLength: 32
        nickname:
          type: string
          minLength: 1
          maxLength: 40
        avatar_url:
          type: string
          minLength: 8
          maxLength: 2048
        role:
          type: string
          enum: [user, reviewer, admin]
        created_at:
          $ref: "#/components/schemas/Timestamp"
    AuthSession:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_at, user]
      properties:
        access_token:
          type: string
          minLength: 20
          maxLength: 256
        token_type:
          type: string
          const: Bearer
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        user:
          $ref: "#/components/schemas/AuthUser"
    AuthSessionEnvelope:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelopeBase"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/AuthSession"
    Session:
      type: object
      additionalProperties: false
      required: [id, title, created_at, updated_at, last_message_at]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        title:
          type: string
          minLength: 1
          maxLength: 120
        created_at:
