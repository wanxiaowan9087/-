services:
  postgres:
    image: postgres:17.5-bookworm
    environment:
      POSTGRES_DB: agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8.0.3-bookworm
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    environment:
      APP_DATABASE_URL: postgresql+asyncpg://agent:agent@postgres:5432/agent
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_DATABASE_URL: postgresql+asyncpg://agent:agent@postgres:5432/agent
      APP_REDIS_URL: redis://redis:6379/0
      APP_DEMO_AUTH_ENABLED: "true"
      APP_CORS_ORIGINS: '["http://localhost:5173"]'
      APP_AGENT_VECTOR_STORE_PATH: /app/data/chroma
    ports:
      - "8000:8000"
    volumes:
      - agent-chroma:/app/data/chroma
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  agent-chroma:

