limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=chat_per_ip:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name _;
    client_max_body_size 3m;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;
    large_client_header_buffers 2 8k;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;
    proxy_read_timeout 240s;

    location ~ ^/api/v1/auth/(login|register|sms-codes|password-resets)$ {
        limit_req zone=auth_per_ip burst=6 nodelay;
        limit_conn connections_per_ip 4;
        proxy_pass http://backend:8000;
    }

    location = /api/v1/chat/stream {
        limit_req zone=chat_per_ip burst=4 nodelay;
        limit_conn connections_per_ip 4;
        proxy_pass http://backend:8000;
        add_header X-Accel-Buffering no always;
    }

    location /api/ {
        limit_req zone=api_per_ip burst=30 nodelay;
        limit_conn connections_per_ip 8;
        proxy_pass http://backend:8000;
        add_header X-Accel-Buffering no always;
    }

    location /uploads/ {
        limit_req zone=api_per_ip burst=10 nodelay;
        proxy_pass http://backend:8000;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
